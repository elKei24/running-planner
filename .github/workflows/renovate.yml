# Self-hosted Renovate; renovate.json holds the update rules. Needs the RENOVATE_TOKEN secret: a
# fine-grained personal access token for this repository with read and write access to commit
# statuses, contents, issues, pull requests and workflows. PRs opened with the default GITHUB_TOKEN
# do not trigger CI, so automerge could never pass the required checks. Commit statuses carry the
# minimumReleaseAge check.
name: Renovate

on:
  schedule:
    - cron: '0 4 * * 1' # Monday mornings (UTC)
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: Elias Keis <13063245+elKei24@users.noreply.github.com>
